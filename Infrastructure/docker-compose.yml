services:
  mysql-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: authdb
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authpass
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - auth_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "authuser", "-pauthpass"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "3306:3306"

  authentication:
    build: ../Backend/Java/authentication
    environment:
      QUARKUS_HTTP_PORT: "8080"
      QUARKUS_HTTP_CORS: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "http://localhost:5173"
      QUARKUS_HTTP_CORS_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      QUARKUS_HTTP_CORS_HEADERS: "accept,authorization,content-type,x-requested-with"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://mysql-db:3306/authdb
      QUARKUS_DATASOURCE_USERNAME: authuser
      QUARKUS_DATASOURCE_PASSWORD: authpass
      QUARKUS_DB_GENERATION: update
      JWT_ISSUER: "cinema-auth"
      JWT_PUBLIC_KEY_LOCATION: "publicKey.pem"
      JWT_PRIVATE_KEY_LOCATION: "privateKey.pem"
      QUARKUS_LOG_LEVEL: "INFO"
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "8081:8080"


  postgres-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cinema -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  business-api:
    build:
      context: ../Backend/python
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres-db:5432/cinema
      CORS_ORIGINS: http://localhost:5173
      FLASK_RUN_PORT: "5000"
      FLASK_ENV: production
      DB_USER: app
      DB_PASSWORD: app
      DB_HOST: postgres-db
      DB_PORT: "5432"
      DB_NAME: cinema
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python - << 'PY'\nimport urllib.request, sys\ntry:\n    urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)\n    sys.exit(0)\nexcept Exception:\n    sys.exit(1)\nPY"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ../Frontend/frontend
      dockerfile: Dockerfile.dev
    environment:
      HOST: 0.0.0.0
      PORT: 5173
    volumes:
      - ../Frontend/frontend:/app
      - /app/node_modules
    depends_on:
      authentication:
        condition: service_started
      business-api:
        condition: service_started
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  auth_mysql_data:
  pg_data:
