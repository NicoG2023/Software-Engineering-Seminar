name: CI/CD Pipeline (Python + Quarkus Java)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:

  ############################################
  # PYTHON ANALYSIS (Black) con Poetry
  ############################################
  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update poetry.lock
        run: |
          cd Backend/python
          poetry lock

      - name: Install Python dependencies with Poetry
        run: |
          cd Backend/python
          poetry install --no-root

      - name: Run Black check
        run: |
          cd Backend/python
          poetry run black --check .

      - name: Run tests
        run: |
            cd Backend/python
            poetry run pytest tests --disable-warnings

  ############################################
  # JAVA (Quarkus + Gradle)
  ############################################
  java-build:
    name: Java Quarkus Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Grant execution rights
        run: chmod +x gradlew

      - name: Build Quarkus project
        run: ./gradlew build --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

  ############################################
  # DEPLOY (Flask + Quarkus)
  ############################################
  deploy:
    name: Deploy Python + Quarkus Microservices
    runs-on: ubuntu-latest
    needs: [python-quality, java-build]  # Se ejecuta después de la calidad de código y la construcción

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Despliegue para Python (Flask)
      - name: Deploy Python Flask Microservice
        run: |
          cd Backend/python
          docker-compose -f Infrastructure/docker-compose.yml up -d  # Ajusta según la ubicación de tu docker-compose.yml

      # Despliegue para Java (Quarkus)
      - name: Deploy Java Quarkus Microservice
        run: |
          cd Backend/Java/authentication
          ./gradlew build --no-daemon
          docker-compose -f Infrastructure/docker-compose.yml up -d  # Ajusta según la ubicación de tu docker-compose.yml
