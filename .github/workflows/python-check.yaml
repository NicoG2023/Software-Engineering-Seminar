name: Python Flask Check

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          pip install .
          pip install ".[dev]"

      - name: Run Black check
        run: black --check .

      - name: Run tests
        run: pytest tests/  # O el comando específico para tus pruebas
