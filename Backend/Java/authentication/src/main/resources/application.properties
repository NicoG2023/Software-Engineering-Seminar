quarkus.http.port=${QUARKUS_HTTP_PORT:8080}

quarkus.http.cors.enabled=${QUARKUS_HTTP_CORS:true}
quarkus.http.cors.origins=${QUARKUS_HTTP_CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=${QUARKUS_HTTP_CORS_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
quarkus.http.cors.headers=${QUARKUS_HTTP_CORS_HEADERS:accept,authorization,content-type,x-requested-with}

quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
quarkus.hibernate-orm.database.generation=${QUARKUS_DB_GENERATION:update}

mp.jwt.verify.issuer=${JWT_ISSUER:cinema-auth}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
quarkus.smallrye-jwt.enabled=true
jwt.lifespan.seconds=${JWT_LIFESPAN_SECONDS:3600}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}


quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
