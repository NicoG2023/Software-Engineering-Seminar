[project]
name = "Cinema_Management_System"
version = "0.1.0"
description = "Backend Flask"
requires-python = ">=3.10,<4.0"
dependencies = [
    "blinker==1.9.0",
    "click==8.3.0",
    "Flask==3.1.2",
    "Flask-Cors==6.0.1",
    "Flask-SQLAlchemy==3.1.1",
    "greenlet==3.2.4",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "psycopg2-binary==2.9.10",
    "SQLAlchemy==2.0.43",
    "typing_extensions==4.15.0",
    "Werkzeug==3.1.3",
    "python-dotenv==1.0.1",
    "gunicorn==23.0.0",
    "requests>=2.31.0",
    "pytest (>=9.0.2,<10.0.0)",
]

[project.optional-dependencies]
dev = [
    "black",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.poetry]
name = "Cinema_Management_System"
version = "0.1.0"
description = "Backend Flask"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
blinker = "1.9.0"
click = "8.3.0"
Flask = "3.1.2"
Flask-Cors = "6.0.1"
Flask-SQLAlchemy = "3.1.1"
greenlet = "3.2.4"
itsdangerous = "2.2.0"
Jinja2 = "3.1.6"
MarkupSafe = "3.0.3"
psycopg2-binary = "2.9.10"
SQLAlchemy = "2.0.43"
typing_extensions = "4.15.0"
Werkzeug = "3.1.3"
python-dotenv = "1.0.1"
gunicorn = "23.0.0"
requests = ">=2.31.0"

[tool.poetry.group.dev.dependencies]
black = "*"
behave = ">=1.3.3,<2.0.0"
